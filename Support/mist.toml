# Mist configuration.
#
# Mist is a tiling window manager for macOS. Config is TOML. It hot-reloads: edit
# this file and Mist picks up the changes without a restart.
#
# The default location is ~/Library/Application Support/Mist/mist.toml

# -----------------------------------------------------------------------------
[general]
# gap: spacing (points) between adjacent windows.
gap = 8

# Gap between the tiled grid and the edge of the screen.
outer_gap = 16

# Default layout for a new workspace.
# One of: bsp | horizontal | vertical | stack | monocle | floating
layout = "bsp"

# `animate` and `animation` are rejected at load time. Mist writes each frame
# in one accessibility call, so there is no transition to animate. A config
# that still sets them fails with the value quoted rather than ignoring it.

# -----------------------------------------------------------------------------
# [hotkeys]
# -----------------------------------------------------------------------------
# Format: "<modifier>+<modifier>+....+<key>"
# Modifiers: cmd, alt, ctrl, shift.  Keys use macOS names (h, l, 8, space, ...).
[hotkeys]
focus_left  = "cmd+alt+h"
focus_right = "cmd+alt+l"
focus_up    = "cmd+alt+k"
focus_down  = "cmd+alt+j"
toggle_float = "cmd+alt+f"

# -----------------------------------------------------------------------------
# [[rules]]
# -----------------------------------------------------------------------------
# Rules match windows and apply actions. Conditions within one rule are AND-ed.
# Actions: float, monitor, workspace, layout.
# Examples:

# Keep Safari floating.
[[rules]]
name = "Float Safari"
window_app = "Safari"
float = true

# always_on_top is rejected at load time rather than ignored. The accessibility
# API exposes no window level, so Mist cannot raise another app's window above
# its neighbours, and a key that silently does nothing is worse than a failure.

# Send a specific app to the second monitor.
[[rules]]
window_bundle_id = "com.mitchellh.ghostty"
monitor = 2
# -----------------------------------------------------------------------------
# [[preset]]
# -----------------------------------------------------------------------------
# A preset is a named set of apps you can put back on screen with one key. It
# focuses and tiles the windows of every running app whose bundle id it lists,
# in the order the ids appear, and writes the bundle ids that had no window to
# the log so you can see what was missing.
#
# name        required, unique, also the name in logs
# bundle_ids  required, the apps to collect
# layout      optional, one of the six layouts above; defaults to [general].layout
# hotkey      optional; a preset hotkey cannot duplicate any other binding

# Writing: editor and terminal side by side, docs on the right.
[[preset]]
name = "coding"
bundle_ids = ["com.mitchellh.ghostty", "com.apple.dt.Xcode", "com.apple.Safari"]
layout = "bsp"
hotkey = "cmd+alt+1"

# On a call: the call window on top, chat and notes below it.
[[preset]]
name = "call"
bundle_ids = ["us.zoom.xos", "com.tinyspeck.slackmacgap", "com.apple.Notes"]
layout = "vertical"
hotkey = "cmd+alt+2"
